name: DEV source channel
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      MAJIMEETING_DEV_TEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev-runtime.txt
            pyproject.toml
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libpulse0
      - name: Install pinned Windows runtime
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements-dev-runtime.txt
      - name: Install test tools and source
        run: python -m pip install -e ".[dev]"
      - name: Dependency consistency
        run: python -m pip check
      - name: Tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check .
      - name: Source GUI startup
        run: python -I scripts/run_source.py --smoke-test
      - name: Source editor and audio smoke
        run: python -I scripts/run_source.py --editor-smoke
      - name: Download tiny integration model
        run: python -I scripts/run_source.py --download-smoke test-model
      - name: Real CPU transcription and alignment offline
        run: python -I scripts/run_source.py --inference-smoke test-model
        env:
          HF_HUB_OFFLINE: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
      - name: Build verified source bundle
        if: runner.os == 'Windows'
        run: python .github/scripts/build_dev_bundle.py
      - name: Detect bootstrap changes
        if: runner.os == 'Windows'
        id: changes
        shell: python
        run: |
          import json,os,subprocess
          from pathlib import Path
          event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          base=event.get('pull_request',{}).get('base',{}).get('sha') or event.get('before')
          files=subprocess.check_output(['git','diff','--name-only',base,'HEAD']).decode().splitlines() if base and set(base)!={'0'} else ['scripts/dev_channel.py']
          bootstrap=any(p.startswith(('scripts/dev_', 'scripts/run_source', 'scripts/install-dev', 'scripts/Installer-DEV', '.github/workflows/dev-channel', '.github/scripts/build_dev')) or p in {'requirements-dev-runtime.txt','pyproject.toml'} for p in files)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'bootstrap={str(bootstrap).lower()}\n')
      - name: Real bootstrap under Windows PowerShell 5
        if: runner.os == 'Windows' && steps.changes.outputs.bootstrap == 'true'
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'MAJIMeeting DEV integration'
          & ./scripts/install-dev.ps1 -Root $root -Bundle (Resolve-Path dev-dist/MAJIMeeting-DEV.zip).Path -Manifest (Resolve-Path dev-dist/dev-manifest.json).Path -NoShortcuts
          if ($LASTEXITCODE -ne 0) { throw 'DEV bootstrap failed' }
          py -3.11 -X utf8 "$root/launcher.py" run --smoke
          if ($LASTEXITCODE -ne 0) { throw 'DEV launcher failed' }
          $state = Get-Content "$root/state.json" -Raw | ConvertFrom-Json
          $python = Join-Path $root ("runtimes/" + $state.current.runtime.Substring(0,16) + "/Scripts/python.exe")
          $entry = Join-Path $root ("versions/" + $state.current.commit + "/scripts/run_source.py")
          $env:MAJIMEETING_CHANNEL = 'dev'
          & $python -I -X utf8 $entry --editor-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Fresh DEV runtime editor failed' }
          $env:HF_HUB_OFFLINE = '1'
          & $python -I -X utf8 $entry --inference-smoke (Resolve-Path test-model).Path
          if ($LASTEXITCODE -ne 0) { throw 'Fresh DEV runtime inference failed' }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: MAJIMeeting-DEV-source
          path: dev-dist/*
          if-no-files-found: error
  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MAJIMeeting-DEV-source
          path: dev-dist
      - name: Publish validated source revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          m=json.loads(Path('dev-dist/dev-manifest.json').read_text())
          assert m['commit']==os.environ['GITHUB_SHA']
          assert m['archive_sha256']==hashlib.sha256(Path('dev-dist/MAJIMeeting-DEV.zip').read_bytes()).hexdigest()
          tag='dev-'+m['commit']
          notes=f"Canal DEV Windows x64 / Python3.11, sans compilation. Source {m['commit']}.\nCI : https://github.com/{os.environ['GH_REPO']}/actions/runs/{os.environ['GITHUB_RUN_ID']}\n\nPremiere installation : MAJIMeeting-DEV-Setup.zip, extraire puis lancer Installer-DEV.cmd. Mises a jour suivantes : raccourci Mettre a jour et lancer MAJIMeeting DEV.\n"
          Path('dev-notes.md').write_text(notes)
          found=subprocess.run(['gh','release','view',tag],capture_output=True).returncode==0
          if found:
              raise SystemExit('Revision already published; no overwrite performed.')
          subprocess.run(['gh','release','create',tag,'dev-dist/MAJIMeeting-DEV.zip','dev-dist/dev-manifest.json','dev-dist/MAJIMeeting-DEV-Setup.zip','--target',m['commit'],'--prerelease','--title','MAJIMeeting DEV '+m['commit'][:12],'--notes-file','dev-notes.md'],check=True)
          PY
