name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check .
      - name: GUI startup smoke test
        run: python -m majimeeting --smoke-test
  windows-package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packaging dependencies
        run: python -m pip install . "pyinstaller>=6.11,<7"
      - name: Build Windows application
        run: python -m PyInstaller --noconfirm --clean --windowed --name MAJIMeeting --paths src --collect-all pyaudiowpatch packaging/windows_entry.py
      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $process = Start-Process dist/MAJIMeeting/MAJIMeeting.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Application startup timeout' }
          if ($process.ExitCode -ne 0) { throw "Application failed: $($process.ExitCode)" }
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          & $compiler packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Install and smoke test
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'MAJIMeeting-installed'
          $setup = Start-Process dist/MAJIMeeting-0.1.0-preview-Setup.exe -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$target") -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Installation failed: $($setup.ExitCode)" }
          $app = Start-Process "$target/MAJIMeeting.exe" -ArgumentList '--smoke-test' -PassThru
          if (-not $app.WaitForExit(30000)) { $app.Kill(); throw 'Installed app timeout' }
          if ($app.ExitCode -ne 0) { throw "Installed app failed: $($app.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: MAJIMeeting-Windows-preview
          path: dist/MAJIMeeting-0.1.0-preview-Setup.exe
          if-no-files-found: error
  preview-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MAJIMeeting-Windows-preview
          path: release-assets
      - name: Publish tested installer as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0-preview.${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/*.exe --target "$GITHUB_SHA" --prerelease --title "MAJIMeeting $RELEASE_TAG — prototype enregistrement" --notes-file docs/RELEASE_PREVIEW.md
