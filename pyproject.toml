[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "majimeeting"
version = "0.1.0.dev0"
description = "Offline Windows meeting transcription and reporting"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8"]

[project.scripts]
majimeeting = "majimeeting.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
