[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "majimeeting"
version = "0.2.1.dev0"
description = "Offline Windows meeting transcription and reporting"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "PyAudioWPatch>=0.2.12.7,<0.3; sys_platform == 'win32'", "faster-whisper>=1.2.1,<2", "av>=11,<16", "requests[socks]>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8"]

[project.scripts]
majimeeting = "majimeeting.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

